<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Face Recognition Attendance System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- This is correct -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260817') }}" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="logo-icon">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <span class="brand-text">AttendanceAI</span>
        </div>
        <nav class="sidebar-nav">
          <ul>
            <li>
              <a href="/dashboard" class="nav-link {% if self.active_tab() == 'dashboard' %}active{% endif %}">
                <i class="fa-solid fa-chart-simple"></i>
                <span>Dashboard</span>
              </a>
            </li>
            <li>
              <a href="/students" class="nav-link {% if self.active_tab() == 'students' %}active{% endif %}">
                <i class="fa-solid fa-users"></i>
                <span>Students</span>
              </a>
            </li>
            <li>
              <a href="/attendance" class="nav-link {% if self.active_tab() == 'attendance' %}active{% endif %}">
                <i class="fa-solid fa-video"></i>
                <span>Live Attendance</span>
              </a>
            </li>
            <li>
              <a href="/records" class="nav-link {% if self.active_tab() == 'records' %}active{% endif %}">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Records</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="sidebar-footer">
          <div class="status-indicator">
            <span class="status-dot online"></span>
            <span class="status-label">System Online</span>
          </div>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Header -->
        <header class="app-header">
          <div class="header-title">
            <h1>{% block page_title %}{% endblock %}</h1>
            <p>{% block page_subtitle %}{% endblock %}</p>
          </div>
          <div class="header-profile">
            <span class="profile-role">Administrator</span>
            <div class="avatar">
              <i class="fa-solid fa-user-tie"></i>
            </div>
          </div>
        </header>

        <!-- Pages Section -->
        <div class="content-body">
          {% block content %}{% endblock %}
        </div>
      </main>
    </div>

    <!-- Notification Toast -->
    <div class="toast-container" id="toast-container"></div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
